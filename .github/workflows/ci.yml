name: Build and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test back-end/EduProject_TADProgrammer.Tests/EduProject_TADProgrammer.Tests.csproj --configuration Release --logger trx -clp:ErrorsOnly
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: font-end-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: font-end-react/package-lock.json
      - run: npm ci
      - run: node --test scripts/security.test.cjs
      - run: npm run test:ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
